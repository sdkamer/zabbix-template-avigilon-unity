zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7fcd3ad8d391457296e7623673989ad3
      name: Templates/Video surveillance
  templates:
    - uuid: e8830c91e726499889a026c210b0bee0
      template: 'Avigilon Unity Video by HTTP'
      name: 'Avigilon Unity Video by HTTP'
      description: |
        Monitors Avigilon Unity Video through the Unity API Gateway and Web Endpoint.

        Tested against Unity Video 8.8.0.22, Web Endpoint build 36.0.2. Authentication
        uses an Integration Management client ID and secret with the OAuth 2.0 client
        credentials flow. No Unity username or password is required.

        Version 2 adds physical-device discovery, diagnostic and device-health checks,
        expected-count monitoring, pagination, and server software inventory. Override
        credential macros on each host. Camera and device triggers depend on root
        server/API/site triggers to prevent alert storms during recorder outages.
      groups:
        - name: Templates/Video surveillance
      items:
        - uuid: 23059438e1ce452b8e9d4e7655faaa4e
          name: 'Avigilon: Collect Unity data'
          type: SCRIPT
          key: avigilon.unity.get
          delay: '{$AVIGILON.UPDATE.INTERVAL}'
          history: '1d'
          trends: '0'
          value_type: TEXT
          params: |
            var p = JSON.parse(value);
            var out = {
                server: {
                    available: 0,
                    health_good: 0,
                    health: 'UNKNOWN',
                    software_display_version: '',
                    software_version: ''
                },
                api: {ok: 0},
                site: {reachable: 0, count: 0},
                server_count: {total: 0, available: 0, unavailable: 0},
                camera_count: {total: 0, connected: 0, disconnected: 0, disabled: 0, unknown: 0},
                device_count: {total: 0, connected: 0, disconnected: 0, unknown: 0},
                cameras: [],
                devices: [],
                error: ''
            };

            function cleanUrl(url) {
                return String(url).replace(/\/+$/, '');
            }

            function parseJson(body, label) {
                try {
                    return JSON.parse(body);
                }
                catch (e) {
                    throw label + ' returned invalid JSON';
                }
            }

            function requestJson(req, method, url, body, label) {
                var response;
                if (method === 'POST') {
                    response = req.post(url, body);
                }
                else {
                    response = req.get(url);
                }

                var status = req.getStatus();
                if (status < 200 || status >= 300) {
                    throw label + ' returned HTTP ' + status;
                }

                var decoded = parseJson(response, label);
                if (decoded.status && decoded.status !== 'success') {
                    throw label + ' failed: ' + (decoded.message || decoded.status);
                }
                return decoded;
            }

            function requestCollection(req, url, label) {
                var all = [], offset = 0, limit = 200, pageCount = 0;
                var separator = url.indexOf('?') === -1 ? '?' : '&';

                while (true) {
                    var page = requestJson(
                        req,
                        'GET',
                        url + separator + 'limit=' + limit + '&offset=' + offset,
                        null,
                        label
                    );
                    var collection = page.Collection || [];
                    for (var i = 0; i < collection.length; i++) {
                        all.push(collection[i]);
                    }

                    pageCount++;
                    if (!page.Header || page.Header.HasMore !== true) {
                        break;
                    }
                    if (collection.length === 0 || pageCount >= 50) {
                        throw label + ' pagination did not complete';
                    }
                    offset += collection.length;
                }
                return all;
            }

            function cameraState(status) {
                var state = String(status || 'Unknown').toUpperCase();
                if (state === 'ONLINE' || state === 'CONNECTED') {
                    return 1;
                }
                if (state === 'DISCONNECTED' || state === 'OFFLINE') {
                    return 0;
                }
                if (state === 'DISABLED') {
                    return 2;
                }
                // Unknown states do not create false disconnect alarms.
                return 3;
            }

            function deviceState(device) {
                var connection = String(device.ConnectionStatus || '').toUpperCase();
                var state = String(device.State || '').toUpperCase();
                if (connection === 'CONNECTED' && state === 'ONLINE') {
                    return 1;
                }
                if (connection === 'DISCONNECTED' || state === 'OFFLINE') {
                    return 0;
                }
                return 2;
            }

            var webBase = cleanUrl(p.web_base_url);
            var apiBase = cleanUrl(p.api_base_url);
            var healthReq = new HttpRequest();
            healthReq.addHeader('Accept: application/json');

            try {
                var health = requestJson(
                    healthReq,
                    'GET',
                    webBase + '/mt/api/rest/v1/health?v',
                    null,
                    'Health endpoint'
                );

                out.server.available = 1;
                out.server.health = health.service.status.state || 'UNKNOWN';
                out.server.health_good = out.server.health === 'GOOD' ? 1 : 0;
                out.server.acc_version = health.service.custom.accVersion || '';
                out.server.web_endpoint_version = health.service.version || '';
                out.server.hostname = health.service.custom.hostname || '';
                out.server.start_time = health.service.custom.process.startTime || 0;
            }
            catch (e) {
                out.error = String(e);
                return JSON.stringify(out);
            }

            try {
                if (!p.client_id || !p.client_secret ||
                        p.client_id === 'CHANGE_ME' || p.client_secret === 'CHANGE_ME') {
                    throw 'Set the Avigilon client ID and client secret macros on this host';
                }

                var tokenReq = new HttpRequest();
                tokenReq.addHeader('Accept: application/json');
                tokenReq.addHeader('Content-Type: application/x-www-form-urlencoded');
                var tokenResponse = requestJson(
                    tokenReq,
                    'POST',
                    apiBase + '/connect/token',
                    'grant_type=client_credentials&scope=tq%3Aapi&client_id=' +
                        encodeURIComponent(p.client_id) + '&client_secret=' +
                        encodeURIComponent(p.client_secret),
                    'OAuth token endpoint'
                );
                if (!tokenResponse.access_token) {
                    throw 'OAuth token endpoint returned no access token';
                }

                var apiReq = new HttpRequest();
                apiReq.addHeader('Accept: application/json');
                apiReq.addHeader('Authorization: Bearer ' + tokenResponse.access_token);

                var servers = requestCollection(
                    apiReq,
                    apiBase + '/tq/v2/Servers',
                    'Servers endpoint'
                );
                out.server_count.total = servers.length;
                for (var s = 0; s < servers.length; s++) {
                    if (String(servers[s].State).toUpperCase() === 'AVAILABLE') {
                        out.server_count.available++;
                    }
                    else {
                        out.server_count.unavailable++;
                    }

                    try {
                        var software = requestJson(
                            apiReq,
                            'GET',
                            apiBase + '/tq/v2/Servers/' + encodeURIComponent(servers[s].Id) +
                                '/InstalledSoftwarePackage',
                            null,
                            'Installed software endpoint'
                        );
                        if (!out.server.software_display_version) {
                            out.server.software_display_version = String(software.DisplayVersion || '');
                            out.server.software_version = String(software.Version || '');
                        }
                    }
                    catch (softwareError) {
                        // Older Unity releases may not expose software inventory.
                    }
                }
                out.site.reachable = out.server_count.available > 0 ? 1 : 0;

                var sites = requestCollection(
                    apiReq,
                    apiBase + '/tq/v2/Sites',
                    'Sites endpoint'
                );
                out.site.count = sites.length;
                if (sites.length === 0) {
                    out.site.reachable = 0;
                }

                var cameras = requestCollection(
                    apiReq,
                    apiBase + '/tq/v2/DataSources',
                    'DataSources endpoint'
                );

                for (var i = 0; i < cameras.length; i++) {
                    if (String(cameras[i].Type).toUpperCase() !== 'VIDEO' || !cameras[i].Id) {
                        continue;
                    }

                    var state = cameraState(cameras[i].Status);
                    var diagnosticError = String(cameras[i].Error || 'Unknown');
                    out.cameras.push({
                        id: String(cameras[i].Id),
                        name: String(cameras[i].Name || cameras[i].Id),
                        state: String(cameras[i].Status || 'Unknown'),
                        online: state,
                        diagnostic_error: diagnosticError,
                        diagnostic_ok: diagnosticError.toUpperCase() === 'NOERROR' ? 1 : 0
                    });

                    if (state === 1) {
                        out.camera_count.connected++;
                    }
                    else if (state === 0) {
                        out.camera_count.disconnected++;
                    }
                    else if (state === 2) {
                        out.camera_count.disabled++;
                    }
                    else {
                        out.camera_count.unknown++;
                    }
                }

                out.camera_count.total = out.cameras.length;

                var devices = requestCollection(
                    apiReq,
                    apiBase + '/tq/v2/Devices',
                    'Devices endpoint'
                );
                for (var d = 0; d < devices.length; d++) {
                    if (!devices[d].Id) {
                        continue;
                    }

                    var online = deviceState(devices[d]);
                    out.devices.push({
                        id: String(devices[d].Id),
                        name: String(devices[d].Name || devices[d].Id),
                        type: String(devices[d].Type || 'Unknown'),
                        vendor: String(devices[d].Vendor || 'Unknown'),
                        model: String(devices[d].Model || 'Unknown'),
                        driver: String(devices[d].DriverType || 'Unknown'),
                        version: String(devices[d].Version || 'Unknown'),
                        ip: String(devices[d].IpAddressInUse || ''),
                        state: String(devices[d].State || 'Unknown'),
                        connection_status: String(devices[d].ConnectionStatus || 'Unknown'),
                        online: online
                    });

                    if (online === 1) {
                        out.device_count.connected++;
                    }
                    else if (online === 0) {
                        out.device_count.disconnected++;
                    }
                    else {
                        out.device_count.unknown++;
                    }
                }
                out.device_count.total = out.devices.length;
                out.api.ok = 1;
            }
            catch (e) {
                out.error = String(e);
            }

            return JSON.stringify(out);
          parameters:
            - name: api_base_url
              value: 'https://{HOST.CONN}:{$AVIGILON.API.PORT}'
            - name: client_id
              value: '{$AVIGILON.CLIENT.ID}'
            - name: client_secret
              value: '{$AVIGILON.CLIENT.SECRET}'
            - name: web_base_url
              value: 'https://{HOST.CONN}:{$AVIGILON.WEB.PORT}'
          timeout: '{$AVIGILON.TIMEOUT}'
          description: 'Collects service, site, server, software, camera, and physical-device information. Collection endpoints are paginated.'
          tags:
            - tag: component
              value: raw
        - uuid: 4e72114711594b45b8f53093b9d4b47e
          name: 'Avigilon: Collect physical-device health'
          type: SCRIPT
          key: avigilon.device.health.get
          delay: '{$AVIGILON.HEALTH.INTERVAL}'
          history: '1d'
          trends: '0'
          value_type: TEXT
          params: |
            var p = JSON.parse(value);
            var out = {
                api: {ok: 0},
                device_count: {total: 0, checked: 0, skipped: 0, errors: 0},
                health: [],
                error: ''
            };

            function cleanUrl(url) {
                return String(url).replace(/\/+$/, '');
            }

            function parseJson(body, label) {
                try {
                    return JSON.parse(body);
                }
                catch (e) {
                    throw label + ' returned invalid JSON';
                }
            }

            function requestJson(req, method, url, body, label) {
                var response = method === 'POST' ? req.post(url, body) : req.get(url);
                var status = req.getStatus();
                if (status < 200 || status >= 300) {
                    throw label + ' returned HTTP ' + status;
                }
                return parseJson(response, label);
            }

            function requestCollection(req, url, label) {
                var all = [], offset = 0, limit = 200, pageCount = 0;
                var separator = url.indexOf('?') === -1 ? '?' : '&';

                while (true) {
                    var page = requestJson(
                        req,
                        'GET',
                        url + separator + 'limit=' + limit + '&offset=' + offset,
                        null,
                        label
                    );
                    var collection = page.Collection || [];
                    for (var i = 0; i < collection.length; i++) {
                        all.push(collection[i]);
                    }
                    pageCount++;
                    if (!page.Header || page.Header.HasMore !== true) {
                        break;
                    }
                    if (collection.length === 0 || pageCount >= 50) {
                        throw label + ' pagination did not complete';
                    }
                    offset += collection.length;
                }
                return all;
            }

            var apiBase = cleanUrl(p.api_base_url);

            try {
                if (!p.client_id || !p.client_secret ||
                        p.client_id === 'CHANGE_ME' || p.client_secret === 'CHANGE_ME') {
                    throw 'Set the Avigilon client ID and client secret macros on this host';
                }

                var tokenReq = new HttpRequest();
                tokenReq.addHeader('Accept: application/json');
                tokenReq.addHeader('Content-Type: application/x-www-form-urlencoded');
                var tokenResponse = requestJson(
                    tokenReq,
                    'POST',
                    apiBase + '/connect/token',
                    'grant_type=client_credentials&scope=tq%3Aapi&client_id=' +
                        encodeURIComponent(p.client_id) + '&client_secret=' +
                        encodeURIComponent(p.client_secret),
                    'OAuth token endpoint'
                );
                if (!tokenResponse.access_token) {
                    throw 'OAuth token endpoint returned no access token';
                }

                var apiReq = new HttpRequest();
                apiReq.addHeader('Accept: application/json');
                apiReq.addHeader('Authorization: Bearer ' + tokenResponse.access_token);
                var devices = requestCollection(
                    apiReq,
                    apiBase + '/tq/v2/Devices',
                    'Devices endpoint'
                );

                var configuredLimit = parseInt(p.health_limit, 10);
                if (isNaN(configuredLimit) || configuredLimit < 0) {
                    configuredLimit = 50;
                }
                var checkLimit = configuredLimit === 0 ? devices.length :
                    Math.min(configuredLimit, devices.length);
                out.device_count.total = devices.length;

                for (var i = 0; i < devices.length; i++) {
                    var result = {
                        id: String(devices[i].Id),
                        name: String(devices[i].Name || devices[i].Id),
                        checked: i < checkLimit ? 1 : 0,
                        request_ok: 1,
                        health_ok: 2,
                        error_status: 'NotChecked',
                        lost_network: 0,
                        prolonged_error: 0
                    };

                    if (i >= checkLimit) {
                        out.device_count.skipped++;
                        out.health.push(result);
                        continue;
                    }

                    out.device_count.checked++;
                    try {
                        var health = requestJson(
                            apiReq,
                            'GET',
                            apiBase + '/tq/v2/Devices/' + encodeURIComponent(devices[i].Id) +
                                '/Health',
                            null,
                            'Device health endpoint'
                        );
                        result.error_status = String(health.ErrorStatus || 'Unknown');
                        result.lost_network = health.HasLostNetworkConnection === true ? 1 : 0;
                        result.prolonged_error = health.HasProlongedError === true ? 1 : 0;
                        result.health_ok = result.error_status.toUpperCase() === 'NOERROR' &&
                            result.lost_network === 0 && result.prolonged_error === 0 ? 1 : 0;
                    }
                    catch (deviceError) {
                        result.request_ok = 0;
                        result.health_ok = 0;
                        result.error_status = 'RequestError';
                        out.device_count.errors++;
                    }
                    out.health.push(result);
                }

                out.api.ok = out.device_count.errors === 0 ? 1 : 0;
                if (out.device_count.errors > 0) {
                    out.error = out.device_count.errors + ' device health request(s) failed';
                }
            }
            catch (e) {
                out.error = String(e);
            }

            return JSON.stringify(out);
          parameters:
            - name: api_base_url
              value: 'https://{HOST.CONN}:{$AVIGILON.API.PORT}'
            - name: client_id
              value: '{$AVIGILON.CLIENT.ID}'
            - name: client_secret
              value: '{$AVIGILON.CLIENT.SECRET}'
            - name: health_limit
              value: '{$AVIGILON.HEALTH.MAX.DEVICES}'
          timeout: '{$AVIGILON.HEALTH.TIMEOUT}'
          description: 'Collects detailed health for physical devices at a lower frequency. A limit prevents large sites from exceeding the script timeout; zero checks all devices.'
          tags:
            - tag: component
              value: raw
        - uuid: 4d0c4ea38c6146cebe1d5d9739769fce
          name: 'Avigilon: Server available'
          type: DEPENDENT
          key: avigilon.server.available
          trends: '365d'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.server.available
          master_item:
            key: avigilon.unity.get
          tags:
            - tag: component
              value: availability
          triggers:
            - uuid: ff4d3c83a365411fb1367b4806277efd
              expression: 'max(/Avigilon Unity Video by HTTP/avigilon.server.available,{$AVIGILON.FAIL.TIME})=0 or nodata(/Avigilon Unity Video by HTTP/avigilon.unity.get,{$AVIGILON.NODATA.TIME})=1'
              name: 'Avigilon: Unity server or Web Endpoint is unavailable'
              priority: HIGH
              description: 'The public Web Endpoint health request is failing. Camera triggers depend on this problem to prevent an alert storm.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 011f1b41c6b34c3d8680d27bc1226352
          name: 'Avigilon: Web Endpoint health is good'
          type: DEPENDENT
          key: avigilon.server.health.good
          trends: '365d'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.server.health_good
          master_item:
            key: avigilon.unity.get
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: f566d24ad24948b58b6fd9ee86044960
              expression: 'max(/Avigilon Unity Video by HTTP/avigilon.server.health.good,{$AVIGILON.FAIL.TIME})=0'
              name: 'Avigilon: Web Endpoint health is not GOOD'
              priority: HIGH
              dependencies:
                - name: 'Avigilon: Unity server or Web Endpoint is unavailable'
                  expression: 'max(/Avigilon Unity Video by HTTP/avigilon.server.available,{$AVIGILON.FAIL.TIME})=0 or nodata(/Avigilon Unity Video by HTTP/avigilon.unity.get,{$AVIGILON.NODATA.TIME})=1'
              tags:
                - tag: scope
                  value: health
        - uuid: 11be5ccc5f8d49018c6b58a1ef2f4c56
          name: 'Avigilon: API collection successful'
          type: DEPENDENT
          key: avigilon.api.ok
          trends: '365d'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.api.ok
          master_item:
            key: avigilon.unity.get
          tags:
            - tag: component
              value: availability
          triggers:
            - uuid: 4f4907ebb07f4131951be089f8be3239
              expression: 'max(/Avigilon Unity Video by HTTP/avigilon.api.ok,{$AVIGILON.FAIL.TIME})=0'
              name: 'Avigilon: API authentication or camera collection failed'
              priority: AVERAGE
              description: 'Check the error item and the per-host credential macros.'
              dependencies:
                - name: 'Avigilon: Unity server or Web Endpoint is unavailable'
                  expression: 'max(/Avigilon Unity Video by HTTP/avigilon.server.available,{$AVIGILON.FAIL.TIME})=0 or nodata(/Avigilon Unity Video by HTTP/avigilon.unity.get,{$AVIGILON.NODATA.TIME})=1'
              tags:
                - tag: scope
                  value: authentication
        - uuid: 6feaeda1909c4a01a40b7609f485abf3
          name: 'Avigilon: Site reachable'
          type: DEPENDENT
          key: avigilon.site.reachable
          trends: '365d'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.site.reachable
          master_item:
            key: avigilon.unity.get
          tags:
            - tag: component
              value: site
          triggers:
            - uuid: 3e33b6b645e94d6c8900ae47f7e8db37
              expression: 'max(/Avigilon Unity Video by HTTP/avigilon.site.reachable,{$AVIGILON.FAIL.TIME})=0'
              name: 'Avigilon: No Unity site is reachable'
              priority: HIGH
              dependencies:
                - name: 'Avigilon: Unity server or Web Endpoint is unavailable'
                  expression: 'max(/Avigilon Unity Video by HTTP/avigilon.server.available,{$AVIGILON.FAIL.TIME})=0 or nodata(/Avigilon Unity Video by HTTP/avigilon.unity.get,{$AVIGILON.NODATA.TIME})=1'
              tags:
                - tag: scope
                  value: site
        - uuid: a985619ea6f24cca8e04e001704198dd
          name: 'Avigilon: Collection error'
          type: DEPENDENT
          key: avigilon.error
          history: '7d'
          trends: '0'
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error
          master_item:
            key: avigilon.unity.get
          tags:
            - tag: component
              value: error
        - uuid: 69249848ad2a4e25ae626d785361c446
          name: 'Avigilon: ACC version'
          type: DEPENDENT
          key: avigilon.acc.version
          history: '7d'
          trends: '0'
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.server.acc_version
              error_handler: CUSTOM_VALUE
              error_handler_params: UNKNOWN
          master_item:
            key: avigilon.unity.get
          tags:
            - tag: component
              value: inventory
        - uuid: 0bab5c1af4d140169e15ab9ec6c59f09
          name: 'Avigilon: Web Endpoint version'
          type: DEPENDENT
          key: avigilon.webendpoint.version
          history: '7d'
          trends: '0'
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.server.web_endpoint_version
              error_handler: CUSTOM_VALUE
              error_handler_params: UNKNOWN
          master_item:
            key: avigilon.unity.get
          tags:
            - tag: component
              value: inventory
        - uuid: 2f542612bf4f4108b457be028c786063
          name: 'Avigilon: Cameras total'
          type: DEPENDENT
          key: avigilon.camera.count.total
          trends: '365d'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.camera_count.total
          master_item:
            key: avigilon.unity.get
          tags:
            - tag: component
              value: cameras
          triggers:
            - uuid: 6bf108815bdb46ad9d84cf88fe06ac33
              expression: '{$AVIGILON.EXPECTED.CAMERA.COUNT}>0 and max(/Avigilon Unity Video by HTTP/avigilon.camera.count.total,{$AVIGILON.FAIL.TIME})<{$AVIGILON.EXPECTED.CAMERA.COUNT}'
              name: 'Avigilon: Camera count is below the expected minimum'
              priority: HIGH
              description: 'The number of video data sources is below the configured expected count. Set the macro to zero to disable this check.'
              dependencies:
                - name: 'Avigilon: API authentication or camera collection failed'
                  expression: 'max(/Avigilon Unity Video by HTTP/avigilon.api.ok,{$AVIGILON.FAIL.TIME})=0'
                - name: 'Avigilon: Unity server or Web Endpoint is unavailable'
                  expression: 'max(/Avigilon Unity Video by HTTP/avigilon.server.available,{$AVIGILON.FAIL.TIME})=0 or nodata(/Avigilon Unity Video by HTTP/avigilon.unity.get,{$AVIGILON.NODATA.TIME})=1'
        - uuid: 509842fc4faf4fa994651f582b165677
          name: 'Avigilon: Cameras connected'
          type: DEPENDENT
          key: avigilon.camera.count.connected
          trends: '365d'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.camera_count.connected
          master_item:
            key: avigilon.unity.get
          tags:
            - tag: component
              value: cameras
        - uuid: a2956cf3985944abb949c9ff1c6bbb09
          name: 'Avigilon: Cameras disconnected'
