      discovery_rules:
        - uuid: 903d8921759e4711b8405d7de3934be4
          name: 'Avigilon: Discover cameras'
          type: DEPENDENT
          key: avigilon.camera.discovery
          lifetime: 30d
          item_prototypes:
            - uuid: e432ae5b3ead41d190eb37c5e3088044
              name: 'Avigilon: Camera {#CAMERA.NAME}: Connection state'
              type: DEPENDENT
              key: 'avigilon.camera.online[{#CAMERA.ID}]'
              trends: '365d'
              description: '0=disconnected, 1=online, 2=disabled, 3=state not recognized by the collector.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.cameras[?(@.id == "{#CAMERA.ID}")].online.first()'
              master_item:
                key: avigilon.unity.get
              tags:
                - tag: camera
                  value: '{#CAMERA.NAME}'
                - tag: component
                  value: camera
              trigger_prototypes:
                - uuid: 38998136a8ec4dbab403936bbff637f2
                  expression: 'max(/Avigilon Unity Video by HTTP/avigilon.camera.online[{#CAMERA.ID}],{$AVIGILON.CAMERA.OFFLINE.TIME})=0 and min(/Avigilon Unity Video by HTTP/avigilon.camera.online[{#CAMERA.ID}],{$AVIGILON.CAMERA.OFFLINE.TIME})=0'
                  name: 'Avigilon: Camera {#CAMERA.NAME} is disconnected'
                  event_name: 'Avigilon camera {#CAMERA.NAME} is disconnected'
                  priority: HIGH
                  description: 'Unity reports this camera offline for the configured grace period.'
                  dependencies:
                    - name: 'Avigilon: API authentication or camera collection failed'
                      expression: 'max(/Avigilon Unity Video by HTTP/avigilon.api.ok,{$AVIGILON.FAIL.TIME})=0'
                    - name: 'Avigilon: Unity server or Web Endpoint is unavailable'
                      expression: 'max(/Avigilon Unity Video by HTTP/avigilon.server.available,{$AVIGILON.FAIL.TIME})=0 or nodata(/Avigilon Unity Video by HTTP/avigilon.unity.get,{$AVIGILON.NODATA.TIME})=1'
                    - name: 'Avigilon: No Unity site is reachable'
                      expression: 'max(/Avigilon Unity Video by HTTP/avigilon.site.reachable,{$AVIGILON.FAIL.TIME})=0'
                  tags:
                    - tag: camera
                      value: '{#CAMERA.NAME}'
                    - tag: scope
                      value: availability
            - uuid: 1544b1db400041e691bc0f4f0d5711d8
              name: 'Avigilon: Camera {#CAMERA.NAME}: Unity status'
              type: DEPENDENT
              key: 'avigilon.camera.status[{#CAMERA.ID}]'
              history: '30d'
              trends: '0'
              value_type: CHAR
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.cameras[?(@.id == "{#CAMERA.ID}")].state.first()'
              master_item:
                key: avigilon.unity.get
              tags:
                - tag: camera
                  value: '{#CAMERA.NAME}'
                - tag: component
                  value: camera
            - uuid: 7a5e95a84a5b43b1a64e92ef72d14a03
              name: 'Avigilon: Camera {#CAMERA.NAME}: Diagnostic status is good'
              type: DEPENDENT
              key: 'avigilon.camera.diagnostic.ok[{#CAMERA.ID}]'
              trends: '365d'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.cameras[?(@.id == "{#CAMERA.ID}")].diagnostic_ok.first()'
              master_item:
                key: avigilon.unity.get
              tags:
                - tag: camera
                  value: '{#CAMERA.NAME}'
                - tag: component
                  value: health
              trigger_prototypes:
                - uuid: 0315575dd635482895b14b69e174999b
                  expression: 'max(/Avigilon Unity Video by HTTP/avigilon.camera.diagnostic.ok[{#CAMERA.ID}],{$AVIGILON.FAIL.TIME})=0 and min(/Avigilon Unity Video by HTTP/avigilon.camera.diagnostic.ok[{#CAMERA.ID}],{$AVIGILON.FAIL.TIME})=0'
                  name: 'Avigilon: Camera {#CAMERA.NAME} reports a diagnostic error'
                  priority: AVERAGE
                  dependencies:
                    - name: 'Avigilon: API authentication or camera collection failed'
                      expression: 'max(/Avigilon Unity Video by HTTP/avigilon.api.ok,{$AVIGILON.FAIL.TIME})=0'
                    - name: 'Avigilon: Unity server or Web Endpoint is unavailable'
                      expression: 'max(/Avigilon Unity Video by HTTP/avigilon.server.available,{$AVIGILON.FAIL.TIME})=0 or nodata(/Avigilon Unity Video by HTTP/avigilon.unity.get,{$AVIGILON.NODATA.TIME})=1'
                    - name: 'Avigilon: No Unity site is reachable'
                      expression: 'max(/Avigilon Unity Video by HTTP/avigilon.site.reachable,{$AVIGILON.FAIL.TIME})=0'
                  tags:
                    - tag: camera
                      value: '{#CAMERA.NAME}'
                    - tag: scope
                      value: health
            - uuid: 30d209b1028745ed9d038be4fd8428dc
              name: 'Avigilon: Camera {#CAMERA.NAME}: Diagnostic error'
              type: DEPENDENT
              key: 'avigilon.camera.diagnostic.error[{#CAMERA.ID}]'
              history: '30d'
              trends: '0'
              value_type: CHAR
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.cameras[?(@.id == "{#CAMERA.ID}")].diagnostic_error.first()'
              master_item:
                key: avigilon.unity.get
              tags:
                - tag: camera
                  value: '{#CAMERA.NAME}'
                - tag: component
                  value: health
          master_item:
            key: avigilon.unity.get
          lld_macro_paths:
            - lld_macro: '{#CAMERA.ID}'
              path: $.id
            - lld_macro: '{#CAMERA.NAME}'
              path: $.name
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.cameras
