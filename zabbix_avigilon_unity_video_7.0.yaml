        - uuid: 25f0991e2de54e9c9d21e8c2d82a915a
          name: 'Avigilon: Cameras with unknown state'
          type: DEPENDENT
          key: avigilon.camera.count.unknown
          trends: '365d'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.camera_count.unknown
          master_item:
            key: avigilon.unity.get
          tags:
            - tag: component
              value: cameras
        - uuid: d278e972a6084c0eac54348190e38cf6
          name: 'Avigilon: Cameras disabled'
          type: DEPENDENT
          key: avigilon.camera.count.disabled
          trends: '365d'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.camera_count.disabled
          master_item:
            key: avigilon.unity.get
          tags:
            - tag: component
              value: cameras
        - uuid: c9a0bbefe2134a76934a117a39d951e7
          name: 'Avigilon: Device health collection successful'
